name: community-index
# Keeps community/index.json in step with the shared items after each merge.
on:
  push:
    branches: [main]
    paths:
      - 'community/*.json'
      - '!community/index.json'
      - 'community/build_index.py'
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 community/build_index.py
      - name: Commit the index if it changed
        run: |
          if [ -n "$(git status --porcelain community/index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add community/index.json
            git commit -m "chore: update community index"
            git push
          fi
